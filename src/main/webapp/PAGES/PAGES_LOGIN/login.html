<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crepes & Waffles - Iniciar Sesión</title>
    <link rel="stylesheet" href="">
    <link rel="stylesheet" href="./../../CSS/style.css">
    <link rel="icon" href="logo.jfif" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="logo-area">
                <img src="logo.jfif" alt="Crepes & Waffles Logo" class="logo">
                <h1>Bienvenido a Crepes & Waffles</h1>
            </div>

            <form id="login-form" class="auth-form active">
                <h2>Iniciar Sesión</h2>
                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <div class="message" id="login-message"></div>
            </form>

            <div class="switch-form-link">
                ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
